<svg xmlns="http://www.w3.org/2000/svg" width="333" height="96" viewBox="0 0 333 96" role="img" aria-label="HIDIVE"><title>HIDIVE</title><desc>Self-contained PNG variants. Light is the fallback; prefers-color-scheme selects the dark variant when supported by the consuming renderer. Original brand colors and transparency are preserved outside documented foreground adjustments.</desc><image href="data:image/png;base64," width="333" height="96"/></svg>
