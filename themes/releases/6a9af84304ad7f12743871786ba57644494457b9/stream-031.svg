<svg xmlns="http://www.w3.org/2000/svg" width="162" height="96" viewBox="0 0 162 96" role="img" aria-label="Paramount+ with Showtime"><title>Paramount+ with Showtime</title><desc>Self-contained PNG variants. Light is the fallback; prefers-color-scheme selects the dark variant when supported by the consuming renderer. Original brand colors and transparency are preserved outside documented foreground adjustments.</desc><style>.on-light{display:inline}.on-dark{display:none}@media(prefers-color-scheme:dark){.on-light{display:none}.on-dark{display:inline}}</style><image class="on-light" href="data:image/png;base64," width="162" height="96"/><image class="on-dark" href="data:image/png;base64," width="162" height="96"/></svg>
